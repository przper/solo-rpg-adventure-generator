services:
  web:
    build:
      context: .
      target: web
    environment:
      APP_ENV: dev
      XDEBUG_ENABLED: 1
      DATABASE_URL: mysqli://user:password@db:3306/rpg?serverVersion=mariadb-10.6.17
    volumes:
      - ./:/var/www/html:rw,cached
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/php.dev.ini:rw,cached
    networks:
      - default
      - web
    labels:
      traefik.enable: 'true'
      traefik.http.routers.rpg.rule: 'Host(`rpg.localhost`)'
      traefik.http.routers.rpg.entrypoints: web
      traefik.docker.network: web
      
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solo_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "33759:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw

volumes:
  postgres_data:

networks:
  web:
    external: true
