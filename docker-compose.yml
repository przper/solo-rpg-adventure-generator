services:
  web:
    build:
      context: .
      target: web
    environment:
      APP_ENV: dev
      XDEBUG_ENABLED: 0
      DATABASE_URL: postgresql://user:password@db:5432/solo_rpg?serverVersion=17&charset=utf8
    volumes:
      - ./:/var/www/html:rw,cached
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/php.dev.ini:rw,cached
    networks:
      - default
      - web
    labels:
      traefik.enable: 'true'
      traefik.http.routers.rpg.rule: 'Host(`rpg.localhost`)'
      traefik.http.routers.rpg.entrypoints: web
      traefik.docker.network: web
      
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solo_rpg}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "33759:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw

volumes:
  postgres_data:

networks:
  web:
    external: true
